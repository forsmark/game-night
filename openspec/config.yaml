schema: spec-driven
skillsScope: project

context: |
  Game Night is a web app for a monthly board game night. Friends join through a group link, answer if they are coming, suggest games, and vote. A planner proposes one, two or three tables.
  Stack: TypeScript, Node 22, Hono, SQLite with Drizzle, React with Vite, TanStack Router and Query, Tailwind, Vitest, pnpm.
  Domain words live in GLOSSARY.md at the repo root and are binding. Use those terms in code, specs and change names.
  This repo follows the spec-checks practice: load the skill spec-checks:practice before you propose, apply or archive a change.

